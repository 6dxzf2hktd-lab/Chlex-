<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Киноквиз: Кинематограф России</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d0f14;
      color: #f4f4f6;
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .header {
      background: #171a23;
      border: 1px solid #2b3142;
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 22px;
      line-height: 1.25;
    }
    .header h1 span { color: #e8b945; }
    .score-box {
      background: #10131a;
      border: 1px solid #e8b945;
      color: #e8b945;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .q-card-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #171a23;
      border: 1px solid #2b3142;
      border-radius: 12px;
      padding: 16px 18px;
      color: #f4f4f6;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .q-card-link:hover {
      border-color: #e8b945;
      background: #1d212d;
    }
    .q-card-link.done-ok { border-color: #2ecc71; }
    .q-card-link.done-bad { border-color: #ff6b6b; }
    .q-num {
      display: inline-block;
      min-width: 30px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      background: #232838;
      color: #e8b945;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .q-card-link.done-ok .q-num { background: #2ecc71; color: #0b1911; }
    .q-card-link.done-bad .q-num { background: #ff6b6b; color: #1f0a0c; }
    .q-left {
      display: flex;
      align-items: center;
    }
    .q-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }
    .q-status {
      font-size: 13px;
      color: #a0a8b8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .single-page {
      background: #171a23;
      border: 1px solid #2b3142;
      border-radius: 16px;
      padding: 24px 20px;
    }
    .back-link {
      display: inline-block;
      color: #e8b945;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 18px;
    }
    .era {
      font-size: 12px;
      color: #e8b945;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 18px;
    }
    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      background: #10131a;
      border: 1px solid #2b3142;
      border-radius: 10px;
      color: #f4f4f6;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .opt-letter {
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #232838;
      color: #e8b945;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .opt-btn.correct { background: rgba(25, 135, 84, 0.28); border-color: #2ecc71; }
    .opt-btn.correct .opt-letter { background: #2ecc71; color: #0b1911; }
    .opt-btn.wrong { background: rgba(220, 53, 69, 0.28); border-color: #ff6b6b; }
    .opt-btn.wrong .opt-letter { background: #ff6b6b; color: #1f0a0c; }
    .info-box {
      background: #10131a;
      border-left: 4px solid #e8b945;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.45;
      color: #d6dae3;
    }
    .info-title { font-weight: 700; color: #e8b945; margin-bottom: 4px; }
    .nav-row {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      background: #e8b945;
      color: #111318;
      font-weight: 700;
      text-decoration: none;
      font-size: 15px;
    }
    .nav-btn.secondary {
      background: #232838;
      color: #f4f4f6;
    }
    .reset-btn {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      background: #232838;
      color: #a0a8b8;
      border: 1px solid #2b3142;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
